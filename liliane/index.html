<style>
/* Identidade Liliane Amarante: cinza #373435, sálvia #999e71, verde #334632, off-white #f3f8ea */
:root{--bg:#F3F8EA;--fg:#282829;--muted:#5C6358;--line:#D6DDC4;--card:#FEFEFE;--accent:#334632;--accent-fg:#F3F8EA;--pill:#334632;--pill-fg:#F3F8EA;--sage:#999E71;--stage:#282829;
--ok:#2C5A33;--ok-bg:#DDEBD6;--warn:#7A5516;--warn-bg:#F3E7CC;--bad:#8C2F2F;--bad-bg:#F4DADA;
--display:'Cormorant Garamond',Georgia,serif;--head:'Poppins',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A2018;--fg:#F3F8EA;--muted:#A8AF9A;--line:#323C2E;--card:#232B20;--accent:#B3B88C;--accent-fg:#1A2018;--pill:#999E71;--pill-fg:#1A2018;--sage:#999E71;--stage:#10150F;--ok:#A8D6A9;--ok-bg:#1F3A25;--warn:#F0C98A;--warn-bg:#44311A;--bad:#F2A3A3;--bad-bg:#4A2222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A2018;--fg:#F3F8EA;--muted:#A8AF9A;--line:#323C2E;--card:#232B20;--accent:#B3B88C;--accent-fg:#1A2018;--pill:#999E71;--pill-fg:#1A2018;--sage:#999E71;--stage:#10150F;--ok:#A8D6A9;--ok-bg:#1F3A25;--warn:#F0C98A;--warn-bg:#44311A;--bad:#F2A3A3;--bad-bg:#4A2222;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:16px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto}
header{margin-bottom:22px}
.eyebrow{font-family:var(--head);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.05;margin:8px 0 10px;text-wrap:balance}
header p{color:var(--muted);margin:0;font-size:15px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-family:var(--head);font-weight:500;font-size:14px;padding:10px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{background:var(--accent);color:var(--accent-fg);border-radius:999px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tab .n.zero{background:var(--line);color:var(--muted)}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);padding:28px 0;font-size:15px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;min-width:0}
.item h2{font-family:var(--head);font-weight:600;font-size:20px;line-height:1.25;margin:0 0 10px;text-wrap:balance}
.fmt{display:inline-block;background:var(--pill);color:var(--pill-fg);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500;letter-spacing:.02em}
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 14px}
.fn{display:inline-block;color:var(--muted);padding:4px 2px;font-size:14px}
.leg{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.leg b{display:block;font-family:var(--head);font-size:19px;font-weight:600;color:var(--accent);margin-bottom:4px}
.leg div{white-space:pre-wrap;overflow-wrap:anywhere}
.leg button{margin-top:8px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;font:inherit;font-size:13px;padding:5px 14px;cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.tag{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.tag[aria-pressed="true"].t-an{background:var(--line)}
.tag[aria-pressed="true"].t-aj{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tag[aria-pressed="true"].t-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.tag[aria-pressed="true"].t-no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.blk{margin:0 0 20px;padding-left:12px;border-left:3px solid var(--sage)}
.blk b{display:block;font-family:var(--head);font-size:19px;line-height:1.25;font-weight:600;color:var(--accent);margin-bottom:5px}
.blk div{white-space:pre-wrap;overflow-wrap:anywhere}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(243,248,234,.5);box-shadow:0 0 0 1px rgba(20,26,18,.25)}
.dots span.on{background:#F3F8EA}
.canva{display:inline-block;margin-top:6px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:500;text-decoration:none}
.vid{display:block;width:100%;max-width:340px;aspect-ratio:9/16;margin:6px 0 16px;background:var(--stage);border-radius:8px}
.stage{position:relative;background:var(--stage);border-radius:8px;overflow:hidden;aspect-ratio:4/5;max-width:100%;touch-action:pan-y}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(20,26,18,.62);color:#F3F8EA;font-size:22px;cursor:pointer}
.nav[disabled]{opacity:.25;cursor:default}
.prev{left:10px}.next{right:10px}
.count{position:absolute;right:10px;top:10px;background:rgba(20,26,18,.62);color:#F3F8EA;font-size:13px;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.thumb{position:relative;padding:0;border:2px solid transparent;background:none;border-radius:3px;cursor:pointer;opacity:.6;aspect-ratio:4/5;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current="true"]{border-color:var(--accent);opacity:1}
.thumb .bd{position:absolute;right:2px;top:2px;background:var(--accent);color:var(--accent-fg);font-size:11px;line-height:1;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.cm{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.cm h3{font-family:var(--head);font-size:16px;color:var(--accent);font-weight:600;margin:0 0 8px}
.cm-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cm-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.cm-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.cm-txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.cm-del{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.cm textarea{width:100%;min-height:70px;resize:vertical;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cm-send{margin-top:8px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;font:inherit;font-weight:500;font-size:14px;padding:8px 18px;cursor:pointer}
.cm-send[disabled]{opacity:.5}
.cm-note{color:var(--muted);font-size:13px;margin:6px 0 0}
.send{margin-top:8px;padding:18px;border:1px dashed var(--sage);border-radius:10px}
.send h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 4px}
.send p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.send button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;font:inherit;font-weight:500;font-size:15px;padding:10px 20px;cursor:pointer}
.send button[disabled]{opacity:.5;cursor:default}
.send .st{margin-top:10px;font-size:14px}
.note{font-size:14px;color:var(--muted);margin-top:6px}
@media (max-width:420px){h1{font-size:36px}.thumbs{gap:4px}}
@media (prefers-reduced-motion:no-preference){.stage img{transition:opacity .15s}}
a.wa{display:inline-block;margin-top:8px;background:var(--accent);color:var(--accent-fg);border-radius:999px;font-weight:500;font-size:14px;padding:8px 18px;text-decoration:none}a.wa.big{font-size:15px;padding:10px 20px;margin-top:0}a.wa[aria-disabled="true"]{opacity:.45;cursor:default}.vid{display:block;width:100%;max-width:340px;aspect-ratio:9/16;margin:6px 0 16px;background:var(--stage);border-radius:8px}
</style>

<h1>O que está esperando por você</h1>

<script>
const ITENS=[{"blocos": [{"t": "Legenda", "x": "O som da água muda a forma como a gente vive o jardim. 🌿\n\nUma cascata bem pensada cria uma pausa no dia: acalma, abafa o ruído de fora e convida a ficar. Por isso, ao projetar, eu penso também no que se ouve, não só no que se vê.\n\n#PaisagismoResidencial #PaisagismoSapiranga #PaisagismoNovoHamburgo #PaisagismoCampoBom"}], "etapa": "criativo", "formato": "Reels [Experiência]", "funcao": "Atrair", "ideia": 32, "legenda": "O som da água muda a forma como a gente vive o jardim. 🌿\n\nUma cascata bem pensada cria uma pausa no dia: acalma, abafa o ruído de fora e convida a ficar. Por isso, ao projetar, eu penso também no que se ouve, não só no que se vê.\n\n#PaisagismoResidencial #PaisagismoSapiranga #PaisagismoNovoHamburgo #PaisagismoCampoBom", "ordem": 1, "poster": "img/c32-poster.jpg", "single": true, "titulo": "O som da água muda o ritmo do dia", "video": "videos/ideia-32-som-da-agua.mp4", "id": "c32"}, {"blocos": [{"t": "Slides (6)", "x": "1. Jardim bom é jardim vivido. Não apenas admirado pela janela.\n2. Um jardim pode estar impecável e, ainda assim, permanecer vazio.\n3. Porque beleza, sozinha, não faz ninguém querer ficar.\n4. É o projeto que cria motivos para usar o espaço: sentar, caminhar, conversar, tomar um café ou simplesmente desacelerar.\n5. Quando o jardim acompanha a rotina da casa, ele deixa de ser cenário e passa a fazer parte da vida.\n6. Para mim, um bom projeto não termina na paisagem. Ele começa nos momentos que serão vividos ali."}], "canva": "https://canva.link/fpt2gwyddbguwu6", "etapa": "aprovado", "ext": ".jpg", "formato": "Carrossel [Numerado]", "funcao": "Atrair", "ideia": 36, "legenda": "Há jardins que impressionam à primeira vista. E há jardins que, além de bonitos, convidam a entrar, sentar e permanecer.\n\nNo meu trabalho, penso a estética junto com a rotina de quem vai viver o espaço. A circulação, os lugares de pausa, as vistas, os sons e a forma como a família deseja aproveitar a área externa fazem parte do projeto.\n\nPorque um jardim não precisa apenas combinar com a casa. Ele precisa fazer sentido para a vida que acontece nela.\n\nQue momento você gostaria que o seu jardim proporcionasse com mais frequência?", "n": 6, "ordem": 1, "pre": "img/c36-", "titulo": "Jardim bom é jardim vivido.", "id": "c36"}, {"blocos": [{"t": "Por que esta ideia", "x": "Marcelo vê referências bonitas, mas não consegue avaliar sozinho se uma espécie funciona no terreno dele. Mostra o critério por trás da escolha de uma planta e aproxima o público da forma de pensar da Liliane, sem vender planta. Completa a série \"Por que eu uso\" (guaimbê e pitosporo)."}, {"t": "Gancho", "x": "\"Por que eu uso capim-do-Texas nos meus projetos.\""}, {"t": "Como executar", "x": "Carrossel [Etiqueta]: slide 1 com o nome da planta; slides do meio com critério de escolha, versatilidade e aplicação no projeto, cada um com foto real; um slide com pergunta ao público; último slide com convite suave para conversar."}, {"t": "O que precisamos da Liliane", "x": "Os critérios dela para usar essa planta (áudio de 1 a 2 minutos ou texto), para o conteúdo sair na voz dela. Fotos reais de projetos com a planta são opcionais."}], "etapa": "ideia", "formato": "Carrossel [Etiqueta]", "funcao": "Qualificar", "ideia": 5, "ordem": 1, "titulo": "Por que eu uso: Capim-do-Texas", "id": "i05"}, {"blocos": [{"t": "Por que esta ideia", "x": "Quem já tem árvores ou plantas no terreno teme perder algo de valor ou conviver com algo que atrapalha o projeto. Mostra a leitura do terreno e tira uma dúvida que costuma travar o primeiro contato."}, {"t": "Gancho", "x": "\"Já tem plantas no seu terreno? Elas entram na conversa do projeto.\""}, {"t": "Como executar", "x": "Reels [Misto] de 20 a 30 s: a Liliane no terreno explicando o que observa antes de decidir o que fica, com imagens de projeto real e convite à conversa no final."}, {"t": "O que precisamos da Liliane", "x": "Gravação dela em um terreno com plantas existentes (pode ser numa visita técnica), explicando como avalia o que aproveitar."}], "etapa": "ideia", "formato": "Reels [Misto]", "funcao": "Qualificar", "ideia": 9, "ordem": 2, "titulo": "Já tenho plantas no terreno. Dá para aproveitar no projeto?", "id": "i09"}, {"blocos": [{"t": "Por que esta ideia", "x": "Conteúdo sensorial, de identificação: mostra a vivência de um espaço sem explicar nada. Traduz a palavra \"vivência\", central na sua marca, em uma cena do dia a dia e atrai quem ainda está no momento de desejo."}, {"t": "Gancho", "x": "A própria cena, com o jardim aparecendo ao fundo da xícara nos primeiros segundos. Texto opcional na tela: \"O dia também pode começar do lado de fora.\""}, {"t": "Como executar", "x": "Reels [Experiência] de 10 a 20 s, com som ambiente real e sem narração: xícara na mesa ou no banco, jardim ao fundo, luz da manhã."}, {"t": "O que precisamos da Liliane", "x": "Vídeo vertical de 10 a 20 s da cena, gravado de manhã, em jardim dela ou de cliente com autorização."}], "etapa": "ideia", "formato": "Reels [Experiência]", "funcao": "Atrair", "ideia": 10, "ordem": 3, "titulo": "Um café, uma manhã e o jardim ao fundo", "id": "i10"}, {"blocos": [{"t": "Por que esta ideia", "x": "Marcelo não sabe avaliar sozinho se sol forte, sombra ou meia-sombra limita o projeto. A resposta mostra a condição real do espaço do público e abre uma conversa técnica com quem já está pensando no assunto."}, {"t": "Gancho", "x": "\"Hoje quero perguntar uma coisa para vocês: quanto sol o seu jardim recebe?\""}, {"t": "Como executar", "x": "Dia 1: Enquete com três opções (sol o dia todo, só parte do dia, quase nada) e Caixinha para contar como é o sol e a sombra no espaço. Dia 2: Stories de resposta com o resultado e a Liliane comentando o que observa em cada condição de luz. A figurinha é colocada manualmente."}, {"t": "O que precisamos da Liliane", "x": "Nada para o dia 1. Para o dia 2: uma fala curta dela (20 a 30 s) sobre cada condição de luz."}], "etapa": "ideia", "formato": "Stories [Enquete]", "funcao": "Qualificar", "ideia": 12, "ordem": 4, "titulo": "Quanto sol o seu jardim recebe de verdade?", "id": "i12"}, {"blocos": [{"t": "Por que esta ideia", "x": "Quem acompanha e está avaliando contratar não vê o que acontece antes da obra. Mostra como a Liliane pensa e decide (mesa, croqui, tela) e ajuda o seguidor a avaliar se esse método combina com ele. A caixinha final revela em que momento o seguidor está."}, {"t": "Gancho", "x": "\"Antes de ter jardim, tem isto aqui.\""}, {"t": "Como executar", "x": "4 ou 5 stories no mesmo dia: mesa com croqui, tela com o desenho, amostras ou plantas escolhidas e uma frase curta sobre o que ela decide ali. O último é uma Caixinha: \"Em que etapa está o seu jardim? Ainda sonhando, com terreno, ou já com projeto?\""}, {"t": "O que precisamos da Liliane", "x": "3 a 5 fotos ou vídeos curtos dela trabalhando em um projeto (sem dados do cliente) e uma frase sobre o que está decidindo naquele momento."}], "etapa": "ideia", "formato": "Stories [Bastidor]", "funcao": "Qualificar", "ideia": 14, "ordem": 5, "titulo": "Antes do jardim existir, o projeto nasce na mesa", "id": "i14"}, {"blocos": [{"t": "Formato", "x": "5 stories no mesmo dia: quatro vitrines com foto real de projeto (uma por tipo de espaço) e uma Caixinha no final. A figurinha da Caixinha é colocada manualmente."}, {"t": "Story 1 (abertura)", "x": "Texto na tela: Cada espaço da casa pede uma pergunta diferente.\nImagem: vista geral de um projeto da Liliane."}, {"t": "Story 2 (varanda)", "x": "Texto na tela: Varanda: em que momentos do dia você quer estar aqui?"}, {"t": "Story 3 (quintal)", "x": "Texto na tela: Quintal: quem vai usar este espaço, e para quê?"}, {"t": "Story 4 (piscina e fachada)", "x": "Corte 1: Piscina: o que você quer ver, sentir e ter de privacidade ao redor?\nCorte 2: Fachada: que impressão você quer que a casa dê a quem chega?"}, {"t": "Story 5 (caixinha)", "x": "Texto na tela: Qual é o seu espaço e o que te incomoda nele?\nFigurinha: Caixinha de perguntas."}, {"t": "Para a Liliane validar", "x": "As 4 perguntas dos stories 2 a 4 são uma sugestão no tom dela: valide ou troque por frases suas. As fotos são de projetos reais que já estão no Drive."}], "etapa": "roteiro", "formato": "Stories [Vitrine]", "funcao": "Qualificar", "ideia": 16, "ordem": 1, "titulo": "Varanda, quintal, piscina ou fachada: cada espaço pede um olhar", "id": "r16"}, {"blocos": [{"t": "Formato", "x": "Carrossel [Numerado], 6 slides, 1080 × 1350. Um checklist visual para salvar e responder em família."}, {"t": "Slide 1", "x": "Antes de escolher uma planta, responda estas 4 perguntas sobre a sua rotina."}, {"t": "Slide 2", "x": "1. Em quais momentos você gostaria de usar mais a área externa?\nCafé da manhã, fim de tarde, refeições, fins de semana ou momentos de descanso?"}, {"t": "Slide 3", "x": "2. Quem precisa se sentir confortável ali?\nCrianças, pets, convidados, pessoas mais velhas ou toda a família ao mesmo tempo?"}, {"t": "Slide 4", "x": "3. O que faria você evitar esse espaço?\nSol forte, falta de privacidade, manutenção excessiva, circulação ruim ou pouca iluminação?"}, {"t": "Slide 5", "x": "4. Que experiência você gostaria de repetir ali?\nReceber, descansar, brincar, cozinhar, tomar café ou simplesmente ficar mais perto da natureza?"}, {"t": "Slide 6", "x": "O jardim ideal começa nas respostas, não nas plantas.\nSalve este post e responda essas perguntas com quem vive a casa com você.\nSe esse tipo de olhar ajuda você a pensar melhor os espaços, me acompanhe por aqui."}, {"t": "Imagens (projetos reais da Liliane)", "x": "Slide 1: visão geral de um projeto convidativo. Slide 2: diferentes momentos de uso. Slide 3: cenas com família, crianças ou pets. Slide 4: sombra, privacidade, circulação e iluminação. Slide 5: uma cena forte de experiência (mesa externa, descanso, piscina, vegetação). Slide 6: composição limpa com a frase final em destaque."}, {"t": "Legenda", "x": "Antes de escolher espéc a ou pet, o jardim precisa ser pensado de outro jeito. 🌿\n\nAntes de escolher as plantas, eu observo como a família vive: onde as crianças brincam, por onde o pet circula, onde ficam os momentos de descanso. É a partir desse uso que organizo o espaço e escolho a vegetação de cada área.\n\nPorque um jardim não precisa apenas combinar com a casa. Ele precisa funcionar para quem vive nele todos os dias.\n\nQuem usa o seu jardim: crianças, pets ou os dois? Conta aqui nos comentários.\n\nSe quiser conversar sobre o seu espaço, fale comigo pelo WhatsApp. Link na bio.\n\n#ProjetoDePaisagismo #PaisagismoResidencial #PaisagismoSapiranga #PaisagismoNovoHamburgo #PaisagismoCampoBom"}, {"t": "Para a Liliane validar", "x": "A narração traz só o raciocínio geral e não cita espécies. Se quiser falar de plantas a evitar ou cuidados específicos, você mesma diz quais."}], "etapa": "roteiro", "formato": "Reels [Tela dupla]", "funcao": "Qualificar", "ideia": 59, "ordem": 3, "titulo": "Tem criança ou pet em casa? O que pensar antes de escolher as plantas", "id": "r59"}, {"blocos": [{"t": "Formato", "x": "Estático [Leia a legenda], 1080 × 1350. A imagem traz só a pergunta; o conteúdo fica na legenda."}, {"t": "Imagem", "x": "Foto real de jardim de projeto da Liliane, ou detalhe de planta com luz natural, sem pessoas e com respiro para o texto."}, {"t": "Texto na imagem", "x": "O que mais de 10 anos de jardim me ensinaram?\nAssinatura discreta: Liliane Amarante.\n\nVariação em primeira pessoa, se preferir: \"O que eu aprendi com mais de 10 anos criando jardins?\""}, {"t": "Legenda", "x": "Mais de 10 anos criando jardins me ensinaram algumas coisas que levo para cada projeto. 🌿\n\n1. Um espaço bonito não precisa de mais plantas. Precisa de intenção. Cada decisão, do caminho à sombra, muda a forma como a família vive o espaço.\n\n2. A natureza tem o seu tempo. Um projeto bem feito se completa com os anos, e isso faz parte do resultado.\n\n3. Cada terreno tem o seu jeito. O projeto começa por observá-lo: o sol, a casa e a rotina de quem vai estar ali.\n\nSão esses aprendizados que guiam as minhas escolhas, do primeiro desenho à implantação.\n\nE você, o que um jardim já te ensinou? Conta aqui nos comentários e compartilhe com quem está pensando em transformar a área externa.\n\nSe quiser conversar sobre a sua visão para o seu espaço, fale comigo pelo WhatsApp. Link na bio.\n\n#ProjetoDePaisagismo #PaisagismoResidencial #PaisagismoSapiranga #PaisagismoNovoHamburgo #PaisagismoCampoBom"}, {"t": "Para a Liliane validar", "x": "Os 3 aprendizados da legenda são propostas no tom dela. Valide ou troque pelos seus antes de a arte ser feita."}], "etapa": "roteiro", "formato": "Estático [Leia a legenda]", "funcao": "Atrair", "ideia": 60, "ordem": 4, "titulo": "O que dez anos de jardim me ensinaram", "id": "r60"}];
const WA_NUM='';
const ETAPAS=[
 {k:'ideia',aba:'Ideias',tags:['análise de ideia','ajuste de ideia','ideia aprovada','ideia não aprovada'],vazio:'Nenhuma ideia para analisar agora.'},
 {k:'roteiro',aba:'Roteiros',tags:['análise de roteiro','ajuste de roteiro','roteiro aprovado'],vazio:'Nenhum roteiro para analisar agora.'},
 {k:'criativo',aba:'Criativos',tags:['análise criativa','ajuste criativo','criativo aprovado'],vazio:'Nenhum criativo para analisar agora.'},
 {k:'aprovado',aba:'Aprovados',tags:[],vazio:'Nenhum criativo aprovado aguardando programação.'}
];
const NOME_ETAPA={ideia:'Ideia',roteiro:'Roteiro',criativo:'Criativo'};
const CLS=['t-an','t-aj','t-ok','t-no'],VAL=[null,'ajuste','aprovado','naoaprovado'];
const KEY='liliane-aprovacao-v1';
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let decisoes={},obs={},aba=0;const pos={};const links=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');decisoes=s.d||{};obs=s.o||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({d:decisoes,o:obs}))}catch(e){}}
function stat(it){const d=decisoes[it.id];return d==='ajuste'?1:d==='aprovado'?2:d==='naoaprovado'?3:0}
function wa(msg){return 'https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(msg)}
function linha(it){
 const e=ETAPAS.find(x=>x.k===it.etapa);if(!e||!e.tags.length)return null;
 const i=stat(it),o=(obs[it.id]||'').trim();
 if(!i&&!o)return null;
 return '• #'+it.ideia+' '+it.titulo+' ('+NOME_ETAPA[it.etapa]+')'+(i?': '+e.tags[i]:'')+(o?'\n  '+o:'');
}
function setLink(a,msg){
 if(msg){a.href=wa(msg);a.target='_blank';a.rel='noopener';a.removeAttribute('aria-disabled')}
 else{a.removeAttribute('href');a.setAttribute('aria-disabled','true')}
}
function updateLinks(){
 links.forEach(f=>f());
}

function renderTabs(){
 const t=$('tabs');t.textContent='';
 ETAPAS.forEach((e,i)=>{
  const its=ITENS.filter(x=>x.etapa===e.k);
  const pend=e.k==='aprovado'?its.length:its.filter(x=>stat(x)===0).length;
  const b=el('button','tab');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',i===aba);
  b.append(el('span',null,e.aba));
  b.append(el('span','n'+(pend?'':' zero'),pend));
  b.onclick=()=>{aba=i;render()};t.append(b);
 });
}

function obsBox(it){
 const wrap=el('div','cm');
 wrap.append(el('h3',null,'Observações'));
 const ta=el('textarea');ta.id='obs-'+it.id;ta.placeholder='Escreva aqui o que precisa mudar ou o que você achou…';ta.setAttribute('aria-label','Observações');
 ta.value=obs[it.id]||'';
 const a=el('a','wa','Enviar este item pelo WhatsApp');
 const upd=()=>{const l=linha(it);setLink(a,l?'Oi! Aqui é a Liliane. Sobre este conteúdo:\n\n'+l:'')};
 ta.addEventListener('input',()=>{obs[it.id]=ta.value;save();updateLinks()});
 links.push(upd);upd();
 wrap.append(ta,a);return wrap;
}

function card(it,e){
 const c=el('article','item');
 c.append(el('h2',null,'#'+it.ideia+' · '+it.titulo));
 const m=el('div','pills');
 if(it.formato)m.append(el('span','fmt',it.formato));
 if(it.funcao)m.append(el('span','fn','Função: '+it.funcao));
 if(m.childNodes.length)c.append(m);
 if(!it.pre&&(it.etapa==='criativo'||it.etapa==='aprovado')){
  const bx=el('div','blk');bx.append(el('b',null,'Criativo'));
  if(it.video){const v=el('video','vid');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=it.video;if(it.poster)v.poster=it.poster;v.setAttribute('aria-label','Vídeo: '+it.titulo);bx.append(v)}
  (it.blocos||[]).forEach(b=>{const k=el('div','blk');k.append(el('b',null,b.t),el('div',null,b.x));bx.append(k)});
  if(it.canva){const a=el('a','canva','Abrir o carrossel no Canva');a.href=it.canva;a.target='_blank';a.rel='noopener';bx.append(a)}
  c.append(bx);
 }else if(it.etapa==='criativo'||it.etapa==='aprovado'){
  const n=it.n||1,src=i=>it.single?it.pre+it.ext:it.pre+(i+1)+it.ext;
  const s=pos[it.id]||0;
  const st=el('div','stage');const im=el('img');im.src=src(s);im.alt=it.titulo+(it.single?'':', slide '+(s+1));st.append(im);
  if(!it.single){
   const pv=el('button','nav prev','‹');pv.type='button';pv.setAttribute('aria-label','Slide anterior');pv.disabled=s===0;pv.onclick=()=>{pos[it.id]=s-1;render()};
   const nx=el('button','nav next','›');nx.type='button';nx.setAttribute('aria-label','Próximo slide');nx.disabled=s===n-1;nx.onclick=()=>{pos[it.id]=s+1;render()};
   st.append(pv,nx,el('div','count',(s+1)+' / '+n));
   const dt=el('div','dots');for(let i=0;i<n;i++)dt.append(el('span',i===s?'on':''));st.append(dt);
   let x0=null;st.addEventListener('touchstart',ev=>{x0=ev.touches[0].clientX},{passive:true});
   st.addEventListener('touchend',ev=>{if(x0===null)return;const d=ev.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>40){const t=d<0?s+1:s-1;if(t>=0&&t<n){pos[it.id]=t;render()}}});
  }
  c.append(st);
  if(!it.single){
   const th=el('div','thumbs');
   for(let i=0;i<n;i++){
    const b=el('button','thumb');b.type='button';b.setAttribute('aria-label','Slide '+(i+1));if(i===s)b.setAttribute('aria-current','true');
    const ti=el('img');ti.src=src(i);ti.alt='';b.append(ti);
    b.onclick=()=>{pos[it.id]=i;render()};th.append(b);
   }
   c.append(th);
  }
 }else{
  (it.blocos||[]).forEach(b=>{const k=el('div','blk');k.append(el('b',null,b.t),el('div',null,b.x));c.append(k)});
 }
 if(e.k==='aprovado'){
  const lg=el('div','leg');lg.append(el('b',null,'Legenda'));
  lg.append(el('div',null,it.legenda||'Legenda no roteiro.'));
  if(it.legenda){const cb=el('button',null,'Copiar legenda');cb.type='button';cb.onclick=async()=>{try{await navigator.clipboard.writeText(it.legenda);cb.textContent='Copiada'}catch(x){cb.textContent='Selecione e copie o texto'}};lg.append(cb)}
  c.append(lg);
  c.append(el('p','note','Aprovado. Aguardando a programação nas redes.'));return c}
 const tg=el('div','tags');tg.setAttribute('role','group');tg.setAttribute('aria-label','Status');
 const cur=stat(it);
 e.tags.forEach((nome,i)=>{
  const b=el('button','tag '+CLS[i],nome);b.type='button';b.setAttribute('aria-pressed',i===cur);
  b.onclick=()=>{if(VAL[i]===null)delete decisoes[it.id];else decisoes[it.id]=VAL[i];save();render()};
  tg.append(b);
 });
 c.append(tg);
 if(cur===1)c.append(el('p','note','Escreva abaixo o que precisa mudar.'));
 c.append(obsBox(it));
 return c;
}

function render(){
 links.length=0;
 renderTabs();
 const e=ETAPAS[aba],box=$('list');
 $('foot').hidden=e.k==='aprovado';
 box.textContent='';
 const its=ITENS.filter(x=>x.etapa===e.k).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
 if(!its.length){box.append(el('p','empty',e.vazio));renderFoot();return}
 its.forEach(it=>box.append(card(it,e)));
 renderFoot();
}
function renderFoot(){
 const f=$('foot');f.textContent='';
 f.append(el('h2',null,'Terminou de analisar?'));
 f.append(el('p',null,'Suas marcações e observações ficam salvas neste aparelho. Ao enviar, abre o WhatsApp com a mensagem pronta para a Flora Digital.'));
 const a=el('a','wa big','Enviar tudo pelo WhatsApp');
 const st=el('p','st','Marque ao menos um item para poder enviar.');
 const upd=()=>{
  const ls=ITENS.map(linha).filter(Boolean);
  setLink(a,ls.length?'Oi! Aqui é a Liliane. Minha análise dos conteúdos:\n\n'+ls.join('\n'):'');
  st.hidden=ls.length>0;
 };
 links.push(upd);upd();
 f.append(a,st);
}
render();
</script>
